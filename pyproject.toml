[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muninn"
version = "0.1.0"
description = "Personal knowledge base from a decade of bookmarks — ingest, scrape, enrich, synthesize, expose."
requires-python = ">=3.12"
dependencies = [
    # Core
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    # Scrape
    "httpx>=0.27,<1",
    # selectolax 1.x removed selectolax.parser (the HTMLParser
    # we use); extraction fails loudly on import if this pin is violated.
    "selectolax>=0.3,<1",
    # Enrich
    "anthropic>=2.0,<3",
    "qdrant-client>=1.13",
    # Synthesis
    "jsonschema>=4.21",
    # Consumers
    "jinja2>=3.1",
    # mcp 2.x moved FastMCP out of mcp.server.fastmcp; port deliberately.
    "mcp>=1.0,<2",
]

[project.scripts]
muninn = "muninn.consumers.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pandas>=2.2",
    # Only tests/integration/test_parquet.py reads Parquet back; the export
    # itself is written by DuckDB natively.
    "pyarrow>=15.0",
]
# Local semantic embeddings (EmbeddingGemma via sentence-transformers).
# Heavy (pulls torch) — required for real indexing/search; the pipeline
# runs without it using MUNINN_EMBEDDING_BACKEND=hash (tests, offline).
embeddings = [
    "sentence-transformers>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muninn"]

# The migrations and JSON Schemas live at the repo root; a wheel carries
# them inside the package (muninn._resources finds either copy).
[tool.hatch.build.targets.wheel.force-include]
"schemas/sql" = "muninn/_schemas/sql"
"schemas/json" = "muninn/_schemas/json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
